# LDK Server on Bitcoin Signet with Coinbase cb-mpc threshold MPC-backed channel keys.
#
# Start the two MPC parties first (see run-mpc-parties.sh), then:
#   ldk-server contrib/mpc-signet/ldk-server-signet-mpc.toml
#
# Use a FRESH storage directory: existing channels created with locally derived funding
# keys cannot be migrated to MPC keys.

[node]
network = "signet"
listening_addresses = ["127.0.0.1:19735"]
alias = "ldk-mpc-signet"
grpc_service_address = "127.0.0.1:13536"
# Derive the on-chain wallet from its own mnemonic (generated on first start) so it is not
# derivable from the node mnemonic. Fresh nodes only.
onchain_wallet_mnemonic_path = "/tmp/ldk-server-mpc-signet/onchain_wallet_mnemonic"

[storage.disk]
dir_path = "/tmp/ldk-server-mpc-signet/"

[esplora]
server_url = "https://mempool.space/signet/api"

[log]
level = "Debug"
log_to_file = true

[mpc]
# Client addresses of the MPC parties (see run-mpc-parties.sh). The next is tried when one
# is unreachable.
party_address = "127.0.0.1:7701,127.0.0.1:7702,127.0.0.1:7703,127.0.0.1:7704"
request_timeout_secs = 30
dkg_timeout_secs = 120
