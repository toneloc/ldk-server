[node]
network = "signet"
alias = "umbrel-ldk"
listening_addresses = ["0.0.0.0:3001"]
rest_service_address = "0.0.0.0:3002"

[storage.disk]
dir_path = "/data/ldk"

[log]
level = "Info"
file_path = "/data/ldk-server.log"

[tls]
hosts = ["localhost", "server", "ldk-server"]

[esplora]
server_url = "https://mutinynet.com/api"
