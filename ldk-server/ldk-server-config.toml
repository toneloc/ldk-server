# ldk-server-config.toml

# Lightning node settings
[node]
network = "signet"                            # Bitcoin network to use (mutinynet)
alias = "ldk-regtest"                         # REQUIRED for announcement (<=32 bytes, printable)
listening_addresses = ["127.0.0.1:3001"]      # Lightning node listening addresses
announcement_addresses = ["127.0.0.1:3001"]   # Announcement addresses
rest_service_address = "127.0.0.1:3002"       # LDK Server REST address
# API key is auto-generated to <storage_dir>/<network>/api_key on first run.
# The CLI reads it from there automatically when --api-key is omitted.
#pathfinding_scores_source_url = ""           # External Pathfinding Scores Source
#rgs_server_url = "https://rapidsync.lightningdevkit.org/snapshot/v2/"  # Optional: RGS URL for rapid gossip sync

# Storage settings — replace with a writable directory on your system.
[storage.disk]
dir_path = "/path/to/ldk-server/storage/"

# Logging
[log]
level = "Debug"
file_path = "/path/to/ldk-server/ldk-server.log"

# TLS
[tls]
#cert_path = "/path/to/tls.crt"
#key_path = "/path/to/tls.key"
hosts = ["localhost"]

# ─────────────────────────────────────────────
# CHAIN SOURCE (EXACTLY ONE)
# Regtest ⇒ bitcoind
# ─────────────────────────────────────────────

[esplora]
server_url = "https://mutinynet.com/api"  

# ─────────────────────────────────────────────
# Optional / features
# ─────────────────────────────────────────────

[rabbitmq]
connection_string = ""
exchange_name = ""

# LSPS2 Client Support — uncomment and fill in real values to enable.
# [liquidity.lsps2_client]
# node_pubkey = "<lsp node pubkey>"
# address = "<lsp ip address>:9735"
# token = ""

# Experimental LSPS2 Service Support — uncomment to advertise as an LSP.
# [liquidity.lsps2_service]
# advertise_service = false
# channel_opening_fee_ppm = 1000
# channel_over_provisioning_ppm = 500000
# min_channel_opening_fee_msat = 10000000
# min_channel_lifetime = 4320
# max_client_to_self_delay = 1440
# min_payment_size_msat = 10000000
# max_payment_size_msat = 25000000000
# client_trusts_lsp = false
# require_token = ""
