[workspace]
resolver = "2"
members = ["ldk-server-cli", "ldk-server-client", "ldk-server-grpc", "ldk-server", "ldk-server-mcp", "ldk-server-macaroons", "ldk-server-mpc"]
exclude = ["e2e-tests", "ldk-server-gui"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true

[profile.dev]
panic = "abort"

# ldk-node with the `ExternalFundingSigner` hook (contrib/patches/ldk-node-external-funding-signer.patch)
# applied on top of the pinned upstream revision. See ldk-server-mpc/README.md.
[patch."https://github.com/lightningdevkit/ldk-node"]
ldk-node = { path = "../ldk-node" }
